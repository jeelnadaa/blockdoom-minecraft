game:
  timer-duration: 60      # Duration of each countdown cycle in seconds before a block is selected.
  reveal-delay: 5         # Warning delay in seconds between revealing the block and starting deletion.
  show-next-block-during-timer: false # If true, reveals the next block in actionbar during the timer.
  protect-player-builds: true # If true, manually placed blocks are protected from deletion.
  auto-reload-on-config-change: true # If true, updates via command or GUI take effect instantly.
  enabled-dimensions:     # Dedicated gameplay world names used by the plugin.
    overworld: "blockdoom_overworld"
    nether: "blockdoom_nether"
    end: "blockdoom_end"

performance:
  chunks-per-tick: 10     # Number of loaded chunks processed for deletion per server tick (20 ticks/sec).

blacklist:
  - BEDROCK
  - NETHER_PORTAL
  - END_PORTAL
  - END_PORTAL_FRAME
  - BARRIER
  - STRUCTURE_BLOCK
  - JIGSAW
  - COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - AIR
  - CAVE_AIR
  - VOID_AIR
  - WATER
  - LAVA
  - FIRE
  - SOUL_FIRE

messages:
  timer-tick: "<green>Time until next block deletion: <gold><bold>%time%s</bold></gold></green>"
  timer-tick-known: "<green>Next deletion: <gold><bold>%block%</bold></gold> in <gold><bold>%time%s</bold></gold></green>"
  block-reveal-title: "<red><bold>WARNING!</bold></red>"
  block-reveal-subtitle: "<gold><bold>%block%</bold></gold> will be deleted across the world!"
  deletion-start-title: "<dark_red><bold>DELETING %block%</bold></dark_red>"
  deletion-start-subtitle: "<gray>All natural instances are disintegrating...</gray>"
  victory-title: "<yellow><bold>VICTORY!</bold></yellow>"
  victory-subtitle: "<green>The Ender Dragon is defeated! The world is saved!</green>"
  defeat-title: "<dark_red><bold>DEFEAT!</bold></dark_red>"
  defeat-subtitle: "<gray>Survival is impossible. The world has crumbled.</gray>"

sounds:
  timer-tick: "BLOCK_NOTE_BLOCK_HAT"
  block-reveal: "ENTITY_ENDER_DRAGON_GROWL"
  deletion-start: "ENTITY_WITHER_SPAWN"
  victory: "UI_TOAST_CHALLENGE_COMPLETE"
  defeat: "ENTITY_WITHER_DEATH"
